<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | SpatialEdge Solutions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo"><img src="logo-tagline.png" alt="SpatialEdge Solutions - Precision in Every Pixel"></div>
  <nav>
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="training.html">Online Training</a>
  <a href="contact.html">Enquire Form</a>
  <a href="index.html#contact-info">Contact Info</a>
  <a href="about.html">About</a>
  <a href="organisation-structure.html">Organisation Structure</a>
<a href="careers.html">Careers</a>
</nav>
</header>

<section class="hero">
  <h1>Let's <span class="blue">Work</span> <span class="green">Together</span></h1>
  <p>Send us your project details and we'll get back to you</p>
</section>

<form class="contact-form" id="inquiryForm">
  <input type="text" id="name" placeholder="Your Name" required>
  <input type="email" id="email" placeholder="Your Email" required>
  <input type="tel" id="phone" placeholder="Phone Number (optional)">
  <textarea id="message" rows="5" placeholder="Tell us about your project..."></textarea>
  <button type="submit">Send Inquiry</button>
  <p id="formStatus" style="margin-top:14px; text-align:center;"></p>
</form>

<footer>
  <img src="logo-tagline.png" alt="SpatialEdge Solutions - Precision in Every Pixel" class="footer-logo">
  <p>&copy; 2026 SpatialEdge Solutions. All rights reserved.</p>
</footer>

<script>
  const API_URL = "/api/inquiries";
  const form = document.getElementById("inquiryForm");
  const status = document.getElementById("formStatus");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      message: document.getElementById("message").value
    };

    status.style.color = "black";
    status.textContent = "Sending...";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (response.ok) {
        status.style.color = "green";
        status.textContent = "Thank you! Your inquiry has been sent.";
        form.reset();
      } else {
        status.style.color = "red";
        status.textContent = result.error || "Something went wrong.";
      }
    } catch (err) {
      status.style.color = "red";
      status.textContent = "Could not reach the server. Make sure node server.js is running.";
      console.error(err);
    }
  });
</script>

</body>
</html>
